<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>工具管理器</title>
</head>
<body>
    <div class="tool-manager-panel">
        <!-- 头部 -->
        <div class="tm-header">
            <h2 id="panelTitle">工具管理器</h2>
            <div class="tm-header-actions">
                <ui-button id="createConfigBtn">新建配置</ui-button>
                <ui-button id="importConfigBtn">导入配置</ui-button>
                <ui-button id="exportConfigBtn">导出配置</ui-button>
            </div>
        </div>

        <!-- 配置选择器 -->
        <div class="tm-config-section">
            <div class="tm-config-header">
                <span class="tm-config-title">当前配置</span>
                <div class="tm-config-actions">
                    <ui-button id="editConfigBtn">编辑</ui-button>
                    <ui-button id="deleteConfigBtn">删除</ui-button>
                </div>
            </div>
            <div class="tm-config-selector">
                <ui-select id="configSelector" placeholder="选择配置...">
                    <option value="">选择配置...</option>
                </ui-select>
                <ui-button id="applyConfigBtn">应用</ui-button>
            </div>
        </div>

        <!-- 工具列表 -->
        <div class="tm-tools-section">
            <div class="tm-tools-header">
                <span class="tm-tools-title">工具管理</span>
                <div class="tm-tools-actions">
                    <ui-button id="selectAllBtn">全选</ui-button>
                    <ui-button id="deselectAllBtn">取消全选</ui-button>
                </div>
            </div>
            <div id="toolsContainer" class="tm-tools-container">
                <div class="tm-loading">加载中...</div>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="tm-status-bar">
            <div class="tm-status-info">
                <span>总工具数: <strong id="totalToolsCount">0</strong></span>
                <span>已启用: <strong id="enabledToolsCount">0</strong></span>
                <span>已禁用: <strong id="disabledToolsCount">0</strong></span>
            </div>
            <ui-button id="saveChangesBtn">保存更改</ui-button>
        </div>
    </div>

    <!-- 新建/编辑配置模态框 -->
    <div id="configModal" class="tm-modal">
        <div class="tm-modal-content">
            <div class="tm-modal-header">
                <h3 id="modalTitle">新建配置</h3>
                <button class="tm-modal-close" id="closeModal">&times;</button>
            </div>
            <form id="configForm" class="tm-form">
                <div class="tm-form-group">
                    <label class="tm-form-label" for="configName">配置名称 *</label>
                    <ui-input type="text" id="configName" required></ui-input>
                </div>
                <div class="tm-form-group">
                    <label class="tm-form-label" for="configDescription">描述</label>
                    <ui-textarea id="configDescription" placeholder="可选：添加配置描述"></ui-textarea>
                </div>
                <div class="tm-modal-footer">
                    <ui-button id="cancelConfigBtn">取消</ui-button>
                    <ui-button type="submit" id="saveConfigBtn">保存</ui-button>
                </div>
            </form>
        </div>
    </div>

    <!-- 导入配置模态框 -->
    <div id="importModal" class="tm-modal">
        <div class="tm-modal-content">
            <div class="tm-modal-header">
                <h3>导入配置</h3>
                <button class="tm-modal-close" id="closeImportModal">&times;</button>
            </div>
            <div class="tm-form">
                <div class="tm-form-group">
                    <label class="tm-form-label" for="importConfigJson">配置JSON</label>
                    <ui-textarea id="importConfigJson" placeholder="粘贴配置JSON内容"></ui-textarea>
                </div>
                <div class="tm-modal-footer">
                    <ui-button id="cancelImportBtn">取消</ui-button>
                    <ui-button id="confirmImportBtn">导入</ui-button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
